name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  rust-test:
    name: Rust build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-16 libclang-16-dev swig python3-dev cmake libsodium-dev pkg-config libssl-dev

      - name: Install compatible libpq
        run: sudo bash scripts/install-libpq.sh build

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: rust-test

      - name: Build workspace
        run: cargo build --workspace --all-features --all-targets

      - name: Run workspace tests
        run: cargo test --workspace --all-features --lib --bins --tests

      - name: Run documentation tests
        run: cargo test --workspace --all-features --doc

  rust-quality:
    name: Rust formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-16 libclang-16-dev swig python3-dev cmake libsodium-dev pkg-config libssl-dev

      - name: Install compatible libpq
        run: sudo bash scripts/install-libpq.sh build

      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default 1.98.1

      - name: Check Rust formatting
        run: cargo +nightly fmt --all -- --check --config reorder_imports=true,imports_indent=Block,imports_layout=Mixed

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: rust-quality

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  postgres:
    name: PostgreSQL ${{ matrix.server }} with libpq 17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: [17, 18]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-16 libclang-16-dev swig python3-dev cmake libsodium-dev pkg-config libssl-dev
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Check default graph and build without libpq discovery
        env:
          PQ_LIB_DIR: /nonexistent/libpq-must-not-be-used
        run: |
          python3 scripts/check-postgres-dependencies.py
          cargo build --locked -p moor-daemon -p moor-server -p moorc -p moor-emh
          for binary in moor-daemon moor moorc moor-emh; do
            if ldd "target/debug/$binary" | grep -q libpq; then exit 1; fi
          done
          python3 scripts/test-postgres-cli.py --disabled
      - name: Install minimum supported client
        run: sudo bash scripts/install-libpq.sh build "$(dpkg --print-architecture)" 17
      - name: Run PostgreSQL adapter, storage, and CLI contracts
        env:
          MOOR_PG_TEST_CLI: '1'
        run: scripts/test-postgres-adapter.sh ${{ matrix.server }}
      - name: Check feature forwarding and thread ownership
        run: |
          cargo check --locked -p moor-daemon -p moor-server -p moorc -p moor-emh --features postgres
          cargo test --locked -p moor-db --features postgres --doc
          cargo build --locked -p moor-db --features postgres --example postgres_probe
          ldd target/debug/examples/postgres_probe | grep libpq

  web:
    name: Web workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install FlatBuffers compiler
        env:
          FLATBUFFERS_VERSION: 25.9.23
        run: |
          curl -fsSL "https://github.com/google/flatbuffers/releases/download/v${FLATBUFFERS_VERSION}/Linux.flatc.binary.clang%2B%2B-18.zip" -o /tmp/flatc.zip
          sudo unzip -q /tmp/flatc.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Check Meadow versions
        run: |
          npm run version:check --workspace meadow
          npm run test:version --workspace meadow

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build web clients and packages
        run: |
          npm run web:build
          npm run web-mcp:build

      - name: Check Meadow bundle budgets
        run: |
          npm run test:bundle --workspace meadow
          npm run bundle:check --workspace meadow

      - name: Lint Meadow
        run: npm run lint --workspace meadow

      - name: Type-check web clients and packages
        run: npm run web:typecheck

      - name: Check repository formatting
        run: npm run format:check

  cowbell:
    name: Cowbell core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cowbell

      - name: Check Cowbell
        run: make -C cores/cowbell check

  license:
    name: License headers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install licensure
        run: cargo install licensure --version 0.8.1 --locked

      - name: Check license headers
        run: licensure --check -p
