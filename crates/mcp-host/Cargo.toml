[package]
name = "moor-mcp-host"
version = "2.0.0-dev"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol (MCP) host for the mooR system - enables AI assistants to interact with MOO virtual worlds"

[package.metadata.deb]
depends = "$auto"
extended-description = "Model Context Protocol (MCP) server that enables AI assistants like Claude to interact with MOO virtual worlds through the mooR system."
section = "net"
license-file = ["../../LICENSE", "0"]
priority = "optional"
assets = [
    ["target/release/moor-mcp-host", "/usr/bin/moor-mcp-host", "755"],
]

[dependencies]
# Internal Dependencies
moor-common = { path = "../common" }
moor-compiler = { path = "../compiler" }
moor-runtime-api = { path = "../runtime-api" }
moor-schema = { path = "../schema" }
moor-var = { path = "../var", features = ["json"] }
moor-zmq-client = { path = "../zmq-client" }

# Command Line & Configuration
clap.workspace = true
clap_derive.workspace = true

# Serialization & Data Formats
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true

# Networking & Communication
r0z-async.workspace = true

# Async Runtime & Concurrency
tokio.workspace = true

# Error Handling & Logging
color-eyre.workspace = true
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities & Helpers
diffy.workspace = true
uuid.workspace = true

[[bin]]
name = "moor-mcp-host"
path = "src/main.rs"
